<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a25"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="fg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6c63ff"/>
      <stop offset="100%" stop-color="#00d4aa"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Abstract silhouette -->
  <g opacity="0.85" filter="url(#glow)">
    <circle cx="200" cy="155" r="58" fill="none" stroke="url(#fg)" stroke-width="2"/>
    <path d="M 100 340 Q 100 240 200 240 Q 300 240 300 340 Z" fill="none" stroke="url(#fg)" stroke-width="2"/>
  </g>
  <!-- Neural dots -->
  <g fill="#6c63ff" opacity="0.6">
    <circle cx="80" cy="80" r="2"/>
    <circle cx="320" cy="90" r="2"/>
    <circle cx="350" cy="200" r="2"/>
    <circle cx="60" cy="200" r="2"/>
    <circle cx="90" cy="320" r="2"/>
    <circle cx="310" cy="330" r="2"/>
    <circle cx="150" cy="50" r="2"/>
    <circle cx="250" cy="50" r="2"/>
  </g>
  <g stroke="#6c63ff" stroke-width="0.5" opacity="0.3">
    <line x1="80" y1="80" x2="150" y2="50"/>
    <line x1="150" y1="50" x2="250" y2="50"/>
    <line x1="250" y1="50" x2="320" y2="90"/>
    <line x1="320" y1="90" x2="350" y2="200"/>
    <line x1="60" y1="200" x2="80" y2="80"/>
    <line x1="90" y1="320" x2="60" y2="200"/>
    <line x1="310" y1="330" x2="350" y2="200"/>
  </g>
  <text x="200" y="380" text-anchor="middle" fill="#6a6a7a" font-family="monospace" font-size="11" opacity="0.6">[ PORTRAIT PLACEHOLDER ]</text>
</svg>
